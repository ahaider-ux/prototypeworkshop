<link rel="stylesheet" href="/ui/app.css">

</head>
<body>
<div class="app" id="frame">

  <header class="top" id="top">

    <span class="sp"></span>

  <main class="home" id="home" hidden aria-label="Home"></main>

  <div class="work" id="work" hidden>

      <button type="button" data-t="file" role="tab" aria-selected="true" class="on"><i><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="m8 2.5 5.5 3L8 8.5l-5.5-3Z"/><path d="m2.5 8 5.5 3 5.5-3M2.5 10.5l5.5 3 5.5-3"/></svg></i><span>File</span></button><button type="button" data-t="screens" role="tab" aria-selected="false" class=""><i><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg></i><span>Screens</span></button><button type="button" data-t="agents" role="tab" aria-selected="false" class=""><i><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5c.4 2.6 1.4 3.6 4 4-2.6.4-3.6 1.4-4 4-.4-2.6-1.4-3.6-4-4 2.6-.4 3.6-1.4 4-4Z"/><path d="M12.5 10.5c.2 1 .5 1.3 1.5 1.5-1 .2-1.3.5-1.5 1.5-.2-1-.5-1.3-1.5-1.5 1-.2 1.3-.5 1.5-1.5Z"/></svg></i><span>Agents</span></button><button type="button" data-t="recipes" role="tab" aria-selected="false" class=""><i><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h6.5L13 5v8.5H4Z"/><path d="M6.5 7h4M6.5 9.5h4M6.5 12h2.5"/><path d="M10.5 2.5V5H13"/></svg></i><span>Recipes</span></button><button type="button" data-t="notes" role="tab" aria-selected="false" class=""><i><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1V10l-3.5 3.5H4a1 1 0 0 1-1-1Z"/><path d="M9.5 13.5V11a1 1 0 0 1 1-1H13"/></svg></i><span>Notes</span></button><button type="button" data-t="history" role="tab" aria-selected="false" class=""><i><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg></i><span>History</span></button><button type="button" data-t="activity" role="tab" aria-selected="false" class=""><i><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8.5h2.5l1.5-4 3 8 1.5-4H14"/></svg></i><span>Activity</span></button>
      <span class="sp"></span>
      <button type="button" class="ib32" id="uiToggle" aria-label="Hide panels · ⌘\" data-tip="Hide panels · ⌘\"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M6 3v10"/></svg></button>

    <aside class="lp" id="lp" aria-label="Left panel">
      <div class="lhd" id="lHead"></div>
      <div class="pbody" id="lBody"></div>
      <div class="lfoot" id="lFoot"></div>
    </aside>

    <section class="stage no-rulers" id="stage">
      <div class="cv mode-design tool-move" id="cv" tabindex="0" aria-label="Canvas">
        <canvas class="gfx" id="gfx" aria-hidden="true"></canvas>
        <div class="world" id="world"><div id="boards"></div><svg class="inks" id="inks" aria-hidden="true"></svg><svg class="wires" id="wires" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="currentColor"/></marker></defs></svg><div id="notes"></div></div>
        <div class="hud" id="hud"></div>
        <div class="cvempty" id="cvEmpty" hidden><div class="in"><b>This page is empty</b><span>Place a screen from the Screens panel, or drop an HTML file here to add a prototype.</span><button type="button" class="dbtn sm" id="cvScreens">Show screens</button></div></div>
      </div>
      <canvas class="ruler rh" id="rulerH" aria-hidden="true"></canvas>
      <canvas class="ruler rv" id="rulerV" aria-hidden="true"></canvas>
      <span class="rcorner" aria-hidden="true"></span>
      <div class="banner" id="banner" role="region" aria-label="Page"></div>
      <div class="inktray" id="inkTray" role="toolbar" aria-label="Pens" hidden></div>
      <div class="inktray frametray" id="frameTray" role="toolbar" aria-label="Frame sizes" hidden></div>
      <div class="tb" id="tb" role="toolbar" aria-label="Canvas tools">
        <button class="ib32" data-tool="move" aria-label="Select · V" data-tip="Select · V" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5 12.5 7l-4 1.2-1.6 4.3Z"/></svg></button><button class="ib32" data-tool="hand" aria-label="Hand · H" data-tip="Hand · H" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 8V3.8a1 1 0 0 1 2 0V7.5M7.5 7V2.8a1 1 0 0 1 2 0V7M9.5 7V3.8a1 1 0 0 1 2 0v5.4c0 2.6-1.8 4.3-4.2 4.3-1.6 0-2.6-.7-3.5-2L2.6 9.3a1 1 0 0 1 1.5-1.3L5.5 9.4"/></svg></button><span class="vsep"></span><button class="ib32" data-tool="frame" aria-label="Frame · F" data-tip="Frame · F" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2.5v11M11 2.5v11M2.5 5h11M2.5 11h11"/></svg></button><button class="ib32" data-tool="note" aria-label="Note · N" data-tip="Note · N" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1V10l-3.5 3.5H4a1 1 0 0 1-1-1Z"/><path d="M9.5 13.5V11a1 1 0 0 1 1-1H13"/></svg></button><button class="ib32" data-tool="box" aria-label="Highlight · B" data-tip="Highlight · B" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5V3.5a1 1 0 0 1 1-1H5M11 2.5h1.5a1 1 0 0 1 1 1V5M13.5 11v1.5a1 1 0 0 1-1 1H11M5 13.5H3.5a1 1 0 0 1-1-1V11M7.5 2.5h1M7.5 13.5h1M2.5 7.5v1M13.5 7.5v1"/></svg></button><button class="ib32" data-tool="arrow" aria-label="Arrow · A" data-tip="Arrow · A" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 13 3M7 3h6v6"/></svg></button><button class="ib32" data-tool="comment" aria-label="Comment · C" data-tip="Comment · C" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7l-3 2.5v-2.5H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"/></svg></button><button class="ib32" data-tool="draw" aria-label="Draw · D" data-tip="Draw · D" data-tip-up><svg class="ic" viewBox="0 0 16 16" ari         <button type="button" class="tbtx" id="interactBtn" aria-pressed="false" data-tip="Use the prototype on the canvas · P" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="9" rx="1.5"/><path d="m8.5 8 4.5 1.8-1.9.7-.8 2Z"/></svg>Interact</button>
        <button type="button" class="ib32" id="bringBtn" aria-label="Bring in a Figma link, an app or a picture · L" data-tip="Bring in a link or picture · L" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 0 1 3.5 3.5l-1 1M9 11.5l-1 1A2.5 2.5 0 0 1 4.5 9l1-1"/></svg></button>
        <button type="button" class="tbtx" id="askBtn" data-tip="Ask an agent for a change" data-tip-up><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5c.4 2.6 1.4 3.6 4 4-2.6.4-3.6 1.4-4 4-.4-2.6-1.4-3.6-4-4 2.6-.4 3.6-1.4 4-4Z"/><path d="M12.5 10.5c.2 1 .5 1.3 1.5 1.5-1 .2-1.3.5-1.5 1.5-.2-1-.5-1.3-1.5-1.5 1-.2 1.3-.5 1.5-1.5Z"/></svg>Ask</button>
      </div>
    </section>

    <aside class="rp" id="rp" aria-label="Right panel">
      <div class="rhd"><div class="who" id="who"></div><button type="button" class="ib32" id="presentBtn" aria-label="Present" data-tip="Present"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.2v7.6a.5.5 0 0 0 .76.43l6.1-3.8a.5.5 0 0 0 0-.86l-6.1-3.8a.5.5 0 0 0-.76.43Z"/></svg></button><button type="button" class="createbtn sm" id="shareBtn">Share</button></div>
      <div class="rtabs"><div class="ttabs" id="rTabs" role="tablist" aria-label="Right panel"><button type="button" class="on" data-t="design" role="tab" aria-selected="true">Design</button><button type="button" data-t="prototype" role="tab" aria-selected="false">Prototype</button></div><span class="sp"></span><button type="button" class="zm" id="zPct" aria-haspopup="menu" aria-label="Zoom">100%</button></div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
